<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#34d399;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background -->
  <rect width="100" height="100" rx="20" fill="#0d1028" />
  
  <!-- Trend Line -->
  <path d="M 20 70 L 45 45 L 60 55 L 80 25" fill="none" stroke="url(#grad2)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  
  <!-- Signal Waves -->
  <path d="M 75 15 A 25 25 0 0 1 95 35" fill="none" stroke="url(#grad1)" stroke-width="6" stroke-linecap="round" />
  <path d="M 60 10 A 40 40 0 0 1 100 50" fill="none" stroke="url(#grad1)" stroke-width="4" stroke-linecap="round" opacity="0.6" />
</svg>